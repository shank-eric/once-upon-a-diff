<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Once Upon a Diff Options</title>
    <meta name="manifest.open_in_tab" content="false" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Once Upon a Diff</h1>
    <p class="hint">The extension gets stories from the local bridge. Run <code>once-upon setup</code> to print its port and token, paste them here, then start it with <code>once-upon serve</code>.</p>
    <form id="settings">
      <label for="port">Bridge port</label>
      <input type="number" id="port" min="1024" max="65535" required />
      <label for="token">Bridge token</label>
      <input type="password" id="token" autocomplete="off" spellcheck="false" required />
      <div class="buttons">
        <button type="submit">Save</button>
        <button type="button" id="test">Test connection</button>
      </div>
    </form>
    <p id="status" role="status"></p>
    <ul id="stories"></ul>
    <script type="module" src="./main.js"></script>
  </body>
</html>
