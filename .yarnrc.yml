enableGlobalCache: false

# No install scripts from dependencies (Yarn 4's default, kept explicit); the workspace's own postinstall (husky) still runs.
enableScripts: false

# Only package versions published at least a week ago (minutes; Yarn 4's default is one day).
npmMinimalAgeGate: 10080

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs
